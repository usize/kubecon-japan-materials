# rossoctl-deps helm values for the Kubecon Japan demo platform.
#
# Configures MLflow's LLM judge backend to use local Ollama on the host
# (OpenAI-compatible API) so judges/scorers can be created on the fly
# from the MLflow UI — no external API keys required.
#
# Consumed by scripts/0-platform.sh via:
#   setup-rossoctl.sh --rossoctl-deps-values k8s/rossoctl-deps-values.yaml
#
# Requires the rossoctl fork branch fix/mlflow-scorer-job-runner-v2 (see env.sh),
# which templates these into the mlflow Deployment and starts the Huey
# job runner that executes judge/scorer jobs.
mlflow:
  # Default model for genai judges (MLflow route syntax: provider:/model).
  judgeModel: "openai:/llama3.2:3b"
  # Ollama's OpenAI-compatible endpoint, reachable from pods via the host.
  openaiApiBase: "http://host.docker.internal:11434/v1"
  # Required by the OpenAI client; Ollama ignores the value.
  openaiApiKey: "unused"
