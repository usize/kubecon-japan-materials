# ============================================================================
# finance-tool — Vincent's market data MCP server (yfinance via FastMCP).
#
# Listens on port 8000 with streamable-http transport. Registered with the
# MCP Gateway via finance-tool-httproute.yaml + finance-tool-registration.yaml.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-tool
  namespace: team1
  labels:
    app.kubernetes.io/name: finance-tool
    app.kubernetes.io/part-of: fintech-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finance-tool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finance-tool
        app.kubernetes.io/part-of: fintech-demo
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finance-tool
          image: finance-tool:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: finance-tool
  namespace: team1
  labels:
    app.kubernetes.io/name: finance-tool
    app.kubernetes.io/part-of: fintech-demo
spec:
  selector:
    app.kubernetes.io/name: finance-tool
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  type: ClusterIP
