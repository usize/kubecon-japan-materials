# Istio auth policies for the MCP Gateway.
#
# RequestAuthentication: validates JWTs issued by Keycloak.
# Only tokens with aud "mcp-gateway" are accepted.
#
# AuthorizationPolicy: requires a valid JWT with the correct
# audience claim. Unauthenticated callers get 403.
#
# The agent's AuthBridge sidecar obtains a valid token via
# RFC 8693 token exchange using its SPIFFE identity.
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: mcp-gateway-jwt
  namespace: gateway-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: mcp-gateway
  jwtRules:
    - issuer: "http://keycloak.localtest.me:8080/realms/kagenti"
      jwksUri: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/kagenti/protocol/openid-connect/certs"
      audiences:
        - "mcp-gateway"
      forwardOriginalToken: true
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mcp-gateway-require-jwt
  namespace: gateway-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: mcp-gateway
  action: ALLOW
  rules:
    - when:
        - key: request.auth.claims[aud]
          values: ["mcp-gateway"]
