apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: news-server-route
  namespace: team1
  labels:
    app.kubernetes.io/part-of: finance-ibac-demo
    mcp-server: "true"
spec:
  hostnames:
    - "news-server.mcp.local"
  parentRefs:
    - name: mcp-gateway
      namespace: gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ibac-news-server
          port: 8888
